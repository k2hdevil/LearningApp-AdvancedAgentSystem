<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img">
  <title>Agentic AI</title>
  <!--
    신경망(neural network) 형태의 AI 아이콘 — 입력 3 / 은닉 2 / 출력 1.

    Cloudscape TopNavigation 은 라이트 모드에서도 배경이 어둡습니다(#161D26).
    로고는 항상 어두운 배경 위에 놓이므로 밝은 색만 씁니다.
    (참고 앱의 남색 #232f3e 로고는 이 배경에서 거의 보이지 않습니다.)

    TopNavigation 은 로고를 <img> 로 렌더링하므로 Cloudscape 의
    아이콘 CSS(svg * { stroke: currentColor })가 적용되지 않습니다.
    따라서 fill/stroke 를 속성으로 지정해도 안전합니다.

    작은 크기(24~40px)에서 뭉개지지 않도록 노드 수를 줄이고 반지름을 키웠습니다.
  -->

  <!-- 연결선: 입력층 -> 은닉층 (6개) -->
  <g stroke="#7aa7e0" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <line x1="11" y1="13" x2="24.5" y2="17.5"/>
    <line x1="11" y1="13" x2="24.5" y2="30.5"/>
    <line x1="11" y1="24" x2="24.5" y2="17.5"/>
    <line x1="11" y1="24" x2="24.5" y2="30.5"/>
    <line x1="11" y1="35" x2="24.5" y2="17.5"/>
    <line x1="11" y1="35" x2="24.5" y2="30.5"/>
  </g>

  <!-- 연결선: 은닉층 -> 출력층 (2개) -->
  <g stroke="#ffb84d" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="24.5" y1="17.5" x2="37" y2="24"/>
    <line x1="24.5" y1="30.5" x2="37" y2="24"/>
  </g>

  <!-- 입력층 노드 -->
  <g fill="#4dabf7">
    <circle cx="11" cy="13" r="4"/>
    <circle cx="11" cy="24" r="4"/>
    <circle cx="11" cy="35" r="4"/>
  </g>

  <!-- 은닉층 노드 -->
  <g fill="#22d3ee">
    <circle cx="24.5" cy="17.5" r="4"/>
    <circle cx="24.5" cy="30.5" r="4"/>
  </g>

  <!-- 출력 노드 (AWS 오렌지로 강조) -->
  <circle cx="37" cy="24" r="4.8" fill="#ff9900"/>
</svg>
